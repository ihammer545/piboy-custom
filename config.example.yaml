!Environment
backend: simulator
dev_mode: true
app_config: !AppConfig
  width: 800
  height: 480
  app_side_offset: 24
  app_top_offset: 40
  app_bottom_offset: 36
  font_name: FreeSansBold.ttf
  font_header_size: 18
  font_standard_size: 16
  color_mode: 0
  layout: !LayoutConfig
    gap: 12
    pad: 10
    line_height: 28
    button_min_height: 44
    button_min_width: 100
    list_row_height: 40
    footer_height: 28
sensor_thresholds: !SensorThresholdConfig
  temperature_min: 10.0
  temperature_max: 35.0
  humidity_min: 0.2
  humidity_max: 0.8
simulator: !SimulatorConfig
  lock_pulse_ms: 1500
  event_log_limit: 80
  connect_delay_s: 0.8
input: !InputConfig
  mode: touch_keyboard
  touch: !TouchDeviceConfig
    device: /dev/input/event0
    width: 800
    height: 480
    swap_axes: false
    invert_x: false
    invert_y: false
    rotation: 0
    debounce_ms: 120
    enabled: true
crt: !CrtConfig
  preset: subtle
  # Optional overrides (null = use preset defaults):
  # enabled: true
  # phosphor_floor: 0.018
  # scanlines: 0.16
  # vignette: 0.42
  # grain: 0.045
  # glare: 0.14
  # flicker: 0.004
  # glow: 0.0
  # rounded_corners: 24
  # bezel_inset: 8
  # curvature: 0.009
  # grain_fps: 5
  grain_seed: 42
audio: !AudioConfig
  ui_sounds: !UiSoundsConfig
    enabled: true
    volume: 0.35
    clicks_during_call: false
    min_interval_ms: 30
