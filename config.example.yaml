!Environment
backend: simulator
dev_mode: true
# On Raspberry Pi with 5\" 800×480:
# backend: raspberry
# dev_mode: false
# display_config: !DisplayConfig
#   driver: framebuffer   # safe default (CPU CRT if crt enabled)
#   # driver: gles        # GPU CRT — only after scripts/spike_gles_kms.py is green
#   framebuffer_device: /dev/fb0
app_config: !AppConfig
  width: 800
  height: 480
  app_side_offset: 24
  app_top_offset: 56
  app_bottom_offset: 36
  font_name: FreeSansBold.ttf
  font_header_size: 18
  font_standard_size: 16
  font_tab_size: 24
  color_mode: 0
  layout: !LayoutConfig
    gap: 12
    pad: 10
    line_height: 28
    button_min_height: 44
    button_min_width: 100
    list_row_height: 40
    footer_height: 28
sensor_thresholds: !SensorThresholdConfig
  temperature_min: 10.0
  temperature_max: 35.0
  humidity_min: 0.2
  humidity_max: 0.8
simulator: !SimulatorConfig
  lock_pulse_ms: 1500
  event_log_limit: 80
  connect_delay_s: 0.8
input: !InputConfig
  # touch — экран без GPIO-кнопок (типичный 5\" киоск)
  # touch_keyboard — touch + GPIO keypad/rotary
  mode: touch
  touch: !TouchDeviceConfig
    device: /dev/input/event0
    width: 800
    height: 480
    swap_axes: false
    invert_x: false
    invert_y: false
    rotation: 0
    debounce_ms: 40
    enabled: true
crt: !CrtConfig
  # framebuffer + CPU CRT: use off on Pi 3 (slow). gles driver: subtle is OK.
  preset: off
  # preset: subtle
  # Optional overrides (null = use preset defaults):
  # enabled: true
  # phosphor_floor: 0.018
  # scanlines: 0.16
  # vignette: 0.42
  # grain: 0.045
  # glare: 0.14
  # flicker: 0.004
  # glow: 0.0
  # rounded_corners: 24
  # bezel_inset: 8
  # curvature: 0.009
  # grain_fps: 5
  grain_seed: 42
  # Vertical V-hold roll when switching tabs (~1–2 s). Set tab_roll_enabled: false to disable.
  tab_roll_s: 1.4
  tab_roll_enabled: true
audio: !AudioConfig
  ui_sounds: !UiSoundsConfig
    enabled: true
    volume: 0.35
    clicks_during_call: false
    min_interval_ms: 30
    boot_splash: true
    # audio_setup_done: false
  # output_device_index: 0
  # output_device_name: "plughw"
  # Prefer in-app СЕРВ picker / first-run wizard; YAML/env for UTM debug.
  # config.example.yaml is NOT loaded at runtime — see docs/UI_SOUNDS.md.
